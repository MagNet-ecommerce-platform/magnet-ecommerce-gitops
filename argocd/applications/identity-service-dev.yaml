apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: identity-service-dev
  namespace: argocd
spec:
  project: magnet-platform
  source:
    repoURL: https://github.com/MagNet-ecommerce-platform/magnet-ecommerce-gitops.git
    targetRevision: main
    path: helm/platform/identity-service
    helm:
      valueFiles:
        - values/dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: magnet
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
